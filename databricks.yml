bundle:
  name: telcostream-lakehouse

variables:
  catalog:
    description: Unity Catalog catalog name
    default: dbw_telcostream_dev
  pipeline_schema:
    description: Pipeline output schema
    default: pipeline_lab

targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405611591723186.6.azuredatabricks.net

resources:
  jobs:
    telcostream_pipeline_job:
      name: telcostream_pipeline_job
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: /Users/acshinobi@outlook.com/02_ingest_bronze_cdr
            source: WORKSPACE
          timeout_seconds: 1800
        - task_key: process_silver
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: /Users/acshinobi@outlook.com/04_silver_telcostream
            source: WORKSPACE
          timeout_seconds: 1800
        - task_key: build_gold
          depends_on:
            - task_key: process_silver
          notebook_task:
            notebook_path: /Users/acshinobi@outlook.com/06_gold_telcostream
            source: WORKSPACE
          timeout_seconds: 1800

  pipelines:
    telcostream_sdp:
      name: telcostream_sdp
      catalog: ${var.catalog}
      target: ${var.pipeline_schema}
      serverless: true
      photon: true
      continuous: false
      channel: CURRENT
      libraries:
        - glob:
            include: /Users/acshinobi@outlook.com/telcostream_sdp_00629e5f/transformations/**
