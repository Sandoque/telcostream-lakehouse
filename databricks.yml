bundle:
  name: telcostream-lakehouse

variables:
  catalog:
    description: Unity Catalog catalog name
    default: dbw_telcostream_dev
  pipeline_schema:
    description: Pipeline output schema
    default: pipeline_lab
  workspace_host:
    description: Databricks workspace host for deployment
    default: <WORKSPACE_HOST>
  workspace_user_email:
    description: Workspace home path owner for notebook and pipeline library references
    default: <USER_EMAIL>

targets:
  dev:
    default: true
    workspace:
      host: ${var.workspace_host}

resources:
  jobs:
    telcostream_pipeline_job:
      name: telcostream_pipeline_job
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: /Users/${var.workspace_user_email}/02_ingest_bronze_cdr
            source: WORKSPACE
          timeout_seconds: 1800
        - task_key: process_silver
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: /Users/${var.workspace_user_email}/04_silver_telcostream
            source: WORKSPACE
          timeout_seconds: 1800
        - task_key: build_gold
          depends_on:
            - task_key: process_silver
          notebook_task:
            notebook_path: /Users/${var.workspace_user_email}/06_gold_telcostream
            source: WORKSPACE
          timeout_seconds: 1800

  pipelines:
    telcostream_sdp:
      name: telcostream_sdp
      catalog: ${var.catalog}
      schema: ${var.pipeline_schema}
      serverless: true
      photon: true
      continuous: false
      channel: CURRENT
      libraries:
        - glob:
            include: /Users/${var.workspace_user_email}/<PIPELINE_PROJECT_PATH>/transformations/**
